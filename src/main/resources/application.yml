server:
  port: 8481
spring:
  application:
    name: payment-reconciliation-engine

  datasource:
    url: jdbc:postgresql://localhost:5432/reconciliation_db
    username: postgres
    password: shinjuku22
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  batch:
    jdbc:
      initialize-schema: always 
    job:
      enabled: false 

app: 
  reconciliation:
    incoming-dir: "data/incoming"
    archive-dir: "data/archive"
    chunk-size: 500
    cron: "0 */1 * * * ?" # Cron expression set on every 1 minute (for local testing purpose)
    scheduler-enabled: true